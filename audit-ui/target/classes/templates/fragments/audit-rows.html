<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment file: audit-rows.html
  ──────────────────────────────────────────────────────────────────────────────
  Exports ONE fragment:

    auditSection  ← returned by GET /audit/rows (HTMX endpoint)
                    Renders the complete innerHTML of <div id="auditSection">:
                      1. result-count span
                      2. full table (thead + tbody with data rows)
                      3. pagination wrap

  HTMX swap mechanism:
    hx-target="#auditSection" with swap="innerHTML" replaces all children of
    the wrapper div. Because #auditSection is a plain <div> (not a <tbody>),
    the browser HTML parser does NOT strip any elements — result count span,
    table and pagination all arrive intact. No hx-swap-oob needed.

  Thymeleaf 3.1 restrictions:
    - th:onclick and th:hx-post with string concat are BLOCKED → use th:data-id + JS delegation
    - parametrised sub-fragment called inside th:each causes first-only render bug → rows INLINED
-->

<!-- ══════════════════════════════════════════════════════════════════════════
     Fragment: auditSection  (HTMX endpoint response)
     Renders: result-count + full table (with thead) + pagination
     ══════════════════════════════════════════════════════════════════════════ -->
<th:block th:fragment="auditSection">

  <!-- ── Chester problem / review-tab note ── -->
  <div th:if="${error}" role="alert"
       style="margin:6px 0 10px; padding:10px 12px; border:1px solid var(--red); border-radius:6px; color:var(--red); font-size:13px;"
       th:text="'Could not load events: ' + ${error}">Could not load events</div>
  <div th:if="${note}"
       style="margin:6px 0 10px; padding:8px 12px; border:1px solid var(--border); border-radius:6px; color:var(--text-muted); font-size:12px;"
       th:text="${note}"></div>

  <!-- ── Result count ── -->
  <div class="result-count" style="padding:4px 0 8px;">
    <span id="resultCount"
          th:text="${total} + ' result' + (${total} != 1 ? 's' : '')">0 results</span>
  </div>

  <!-- ── Table (full, thead included so it survives every swap) ── -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="-date">Recorded ↕</th>
          <th>Patient</th>
          <th>Agent</th>
          <th>Facility</th>
          <th>Submitted by</th>
          <th>Purpose</th>
          <th class="sortable" data-sort="-outcome">Outcome ↕</th>
          <th>SLA</th>
          <th>Review</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="auditTbody">

        <!-- Empty state -->
        <tr th:if="${(rows == null or rows.empty) and error == null}">
          <td colspan="10"
              style="text-align:center; padding:40px; color:var(--text-muted); font-size:13px;">
            No audit events match your filters.
          </td>
        </tr>

        <!-- Data rows — INLINED to avoid Thymeleaf 3.1 parametrised-fragment+th:each name-shadow bug -->
        <tr th:each="row : ${rows}"
            th:id="|row-${row.id}|"
            th:class="${row.etreatOrBtg} ? 'etreat-row' : ''"
            th:data-id="${row.id}"
            th:data-review-status="${row.reviewStatus}">

          <td class="td-sm" th:text="${row.recorded}">—</td>
          <td class="td-sm" th:text="${row.patientRef}">—</td>
          <td class="td-sm" th:text="${row.agentName}">—</td>
          <td class="td-sm" th:text="${row.facility}">—</td>
          <td class="td-sm" th:text="${row.submittedBy != null} ? ${row.submittedBy} : '—'">—</td>

          <td>
            <span th:class="${row.purposeTagCss}" th:text="${row.purposeLabel}">—</span>
            <span th:if="${row.breakGlass}" title="Carries the break-glass label"
                  style="margin-left:4px; padding:1px 6px; border:1px solid var(--red); border-radius:10px; color:var(--red); font-size:10px;">BTG label</span>
            <span th:if="${row.incomplete}" title="Stored with the policy-incomplete flag (purpose or provenance missing)"
                  style="margin-left:4px; padding:1px 6px; border:1px solid var(--border); border-radius:10px; color:var(--text-muted); font-size:10px;">incomplete</span>
          </td>

          <td>
            <span th:class="${row.outcomeCss}" th:text="${row.outcomeLabel}">—</span>
          </td>

          <td>
            <span th:class="${row.slaCss}" th:text="${row.slaLabel}">—</span>
          </td>

          <td>
            <span th:class="|rs rs-${row.reviewStatus}|" th:text="${row.reviewStatus}">pending</span>
          </td>

          <td>
            <div class="action-group">

              <!-- View detail — always visible for all roles -->
              <button class="act-btn act-view row-btn view-btn"
                      type="button"
                      data-tip="View detail">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>

              <!-- ── Admin-only action buttons ────────────────────────── -->
              <th:block th:if="${isAdmin}">

                <!-- Mark reviewed (hidden if already reviewed) -->
                <button th:if="${row.reviewStatus != 'reviewed'}"
                        class="act-btn act-review row-btn review-btn"
                        type="button"
                        data-tip="Mark reviewed">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </button>

                <!-- Already reviewed badge (non-clickable indicator) -->
                <button th:if="${row.reviewStatus == 'reviewed'}"
                        class="act-btn act-review"
                        type="button"
                        data-tip="Already reviewed"
                        style="opacity:0.4; cursor:default; pointer-events:none;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </button>

                <!-- Flag (shown when not yet flagged) -->
                <button th:if="${row.reviewStatus != 'flagged'}"
                        class="act-btn act-flag row-btn flag-btn"
                        type="button"
                        data-tip="Flag for follow-up">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                    <line x1="4" y1="22" x2="4" y2="15"/>
                  </svg>
                </button>

                <!-- Unflag (shown when already flagged) -->
                <button th:if="${row.reviewStatus == 'flagged'}"
                        class="act-btn act-unflag row-btn flag-btn"
                        type="button"
                        data-tip="Remove flag">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                  </svg>
                </button>

              </th:block>
              <!-- ── /Admin-only ─────────────────────────────────────── -->

            </div>
          </td>
        </tr>

      </tbody>
    </table>
  </div>

  <!-- ── Pagination controls ── -->
  <div id="paginationWrap" class="pagination-wrap">

    <button class="btn btn-sm page-btn"
            type="button"
            th:disabled="${page <= 1}"
            th:attr="data-page=${page - 1}"
            th:classappend="${page <= 1} ? ' disabled' : ''">&#8592; Prev</button>

    <th:block th:with="startPage=${T(java.lang.Math).max(1, page - 3)},
                       endPage=${T(java.lang.Math).min(totalPages, page + 3)}">
      <button th:each="p : ${#numbers.sequence(startPage, endPage)}"
              class="btn btn-sm page-btn"
              type="button"
              th:attr="data-page=${p}"
              th:classappend="${p == page} ? ' active' : ''"
              th:text="${p}">1</button>
    </th:block>

    <button class="btn btn-sm page-btn"
            type="button"
            th:disabled="${page >= totalPages}"
            th:attr="data-page=${page + 1}"
            th:classappend="${page >= totalPages} ? ' disabled' : ''">Next &#8594;</button>

    <span class="page-info" th:text="|Page ${page} of ${totalPages}|">Page 1 of 1</span>

  </div>

</th:block>

</body>
</html>
