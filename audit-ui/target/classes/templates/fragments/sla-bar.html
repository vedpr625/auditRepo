<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment: sla-bar :: slaBar
  Polled every 60 s. Counts only break-glass-labelled or incomplete events that have no reviewed/flagged decision,
  exactly (asked of Chester), for what the signed-in user may see.
-->
<div th:fragment="slaBar" class="sla-bar">

  <span class="sla-bar-label">Review status:</span>

  <span th:if="${slaError}" style="font-size:11px; color:var(--red-700);" th:text="'Could not check: ' + ${slaError}">Could not check</span>

  <span th:unless="${slaError}">
    <span class="sla-count over" th:text="${overdueCount}">0</span>
    <span style="font-size:11px; color:var(--red-700);" th:text="' overdue (&gt;' + ${slaOverHours} + 'h)'"> overdue</span>
  </span>

  <span th:unless="${slaError}">
    <span class="sla-count soon" th:text="${warningCount}">0</span>
    <span style="font-size:11px; color:var(--amber-700);" th:text="' due soon (' + ${slaWarnHours} + '-' + ${slaOverHours} + 'h)'"> due soon</span>
  </span>

  <span th:if="${slaTruncated}" style="font-size:11px; color:var(--text-muted);">(at least; more than 1000 candidates)</span>

  <span style="font-size:11px; color:var(--text-muted); margin-left:auto;"
        title="The clock runs only for events carrying the break-glass label or stored as incomplete, until they are marked reviewed or flagged. The hours are set by this organisation (audit.sla.* in the UI settings).">
    Unreviewed break-glass and incomplete events only
  </span>

</div>

</body>
</html>
