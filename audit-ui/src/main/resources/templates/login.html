<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Chester Audit</title>
  <!-- System fonts only: this page makes no request to any third-party site. -->
  <style>
    :root {
      --navy:   #0D1117;
      --navy1:  #161B22;
      --navy2:  #21262D;
      --amber:  #F0A500;
      --green:  #3FB950;
      --red:    #F85149;
      --text0:  #E6EDF3;
      --text1:  #8B949E;
      --text2:  #484F58;
      --border: #30363D;
      --mono:   ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      --sans:   system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --radius: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--navy);
      color: var(--text0);
      font-family: var(--sans);
      font-size: 14px;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Logo / wordmark ─────────────────────────────────────────────── */
    .wordmark {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 500;
      color: var(--amber);
      letter-spacing: .04em;
      margin-bottom: 8px;
      text-align: center;
    }

    .tagline {
      font-size: 12px;
      color: var(--text1);
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: .03em;
    }

    /* ── Card ────────────────────────────────────────────────────────── */
    .card {
      background: var(--navy1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 40px;
      width: 100%;
      max-width: 380px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text0);
      margin-bottom: 24px;
    }

    /* ── Form fields ─────────────────────────────────────────────────── */
    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text1);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text0);
      font-family: var(--sans);
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(240,165,0,.15);
    }

    input::placeholder { color: var(--text2); }

    /* ── Sign-in button ──────────────────────────────────────────────── */
    .btn-signin {
      width: 100%;
      background: var(--amber);
      color: #000;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 11px 0;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity .15s, transform .1s;
      letter-spacing: .02em;
    }

    .btn-signin:hover { opacity: .88; }
    .btn-signin:active { transform: scale(.98); }

    /* ── Alert messages ──────────────────────────────────────────────── */
    .alert {
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background: rgba(248,81,73,.1);
      border: 1px solid rgba(248,81,73,.35);
      color: var(--red);
    }

    .alert-success {
      background: rgba(63,185,80,.1);
      border: 1px solid rgba(63,185,80,.35);
      color: var(--green);
    }

    /* ── Footer hint ─────────────────────────────────────────────────── */
    .hint {
      margin-top: 24px;
      font-size: 11px;
      color: var(--text2);
      text-align: center;
      line-height: 1.6;
    }

    .hint code {
      font-family: var(--mono);
      font-size: 10px;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--text1);
    }
  </style>
</head>
<body>

  <div class="wordmark">⚡ Chester</div>
  <p class="tagline">IHE ATNA · BALP v1.1.4 · Audit Event Review</p>

  <div class="card">
    <div class="card-title">Sign in</div>

    <!-- Error message -->
    <div th:if="${param.error}" class="alert alert-error">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Sign-in failed. Please try again or contact your administrator.
    </div>

    <!-- Logout message -->
    <div th:if="${param.logout}" class="alert alert-success">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      You have been signed out.
    </div>

    <!-- Sign-in happens at Keycloak; no password is entered or stored here -->
    <a th:href="@{/oauth2/authorization/keycloak}" class="btn-signin" style="display:block; text-align:center; text-decoration:none;">Sign in with Keycloak →</a>
  </div>



</body>
</html>
