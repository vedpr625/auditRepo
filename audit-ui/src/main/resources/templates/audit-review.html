<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"
      th:attr="data-theme=${prefs.themeAttr()},data-density=${prefs.densityAttr()}">
<head th:replace="~{fragments/layout :: headx(#{explore.title}, 'page-explore.css')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header('explore')}"></th:block>
<main id="main" class="page explore" th:attr="data-m-saved=#{explore.save.done},data-m-savefail=#{explore.save.failed},data-m-marked=#{explore.toast.marked},data-m-nomatch=#{explore.find.none},data-m-show=#{explore.similar.show},data-m-hide=#{explore.similar.hide},data-m-empty=#{explore.panel.empty}">
  <h1 class="sr-only" th:text="#{explore.title}">Explore</h1>

  <!-- Find bar: words, or filters such as facility=Kandy TH outcome!=ok break-glass -->
  <form class="ex-find" id="findForm" role="search" th:action="@{/}" method="get">
    <div class="searchbar ex-search">
      <label class="label" for="searchInput" th:text="#{explore.find}">Find</label>
      <input type="text" id="searchInput" name="q" th:placeholder="#{explore.find.placeholder}" th:title="#{explore.find.help}" autocomplete="off" maxlength="200">
    </div>
    <div class="menu-wrap">
      <button class="btn ex-range" type="button" id="rangeBtn" aria-haspopup="true" aria-expanded="false" th:text="${view.rangeLabel}">Last 24 hours</button>
      <div class="menu" id="rangeMenu" hidden role="menu">
        <button type="button" role="menuitem" data-range="1h" th:text="#{explore.range.1h}">Last hour</button>
        <button type="button" role="menuitem" data-range="24h" th:text="#{explore.range.24h}">Last 24 hours</button>
        <button type="button" role="menuitem" data-range="7d" th:text="#{explore.range.7d}">Last 7 days</button>
        <button type="button" role="menuitem" data-range="30d" th:text="#{explore.range.30d}">Last 30 days</button>
        <button type="button" role="menuitem" data-range="all" th:text="#{explore.range.all}">All time</button>
        <div class="menu-form">
          <label><span th:text="#{explore.range.from}">From</span><input type="date" id="dateFrom" class="input"></label>
          <label><span th:text="#{explore.range.to}">To</span><input type="date" id="dateTo" class="input"></label>
          <button type="button" class="btn btn-sm btn-primary" id="dateApply" th:text="#{explore.range.apply}">Apply dates</button>
        </div>
      </div>
    </div>
    <button class="btn btn-primary ex-go" type="submit" th:text="#{explore.find.go}">Search</button>
  </form>

  <div id="exMain" class="ex-main">
    <div id="auditSection" class="ex-contents">
      <th:block th:insert="~{fragments/audit-rows :: auditSection}"></th:block>
    </div>
    <aside class="ex-side panel" id="eventPanel" aria-live="polite" th:attr="aria-label=#{explore.panel.eyebrow}">
      <div class="px-empty" th:text="#{explore.panel.empty}">Choose an event.</div>
    </aside>
  </div>
</main>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer-panel"   id="drawerPanel"></div>
<div id="toastContainer"></div>
<script th:src="@{/js/page-explore.js}" defer></script>
</body>
</html>
