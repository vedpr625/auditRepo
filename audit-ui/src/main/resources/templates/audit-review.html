<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"
      th:attr="data-theme=${prefs.themeAttr()},data-density=${prefs.densityAttr()}">
<head th:replace="~{fragments/layout :: headx(#{explore.title}, 'page-explore.css')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header('explore')}"></th:block>
<main id="main" class="page explore">
  <div class="page-head">
    <h1 th:text="#{explore.title}">Explore</h1><span class="lede" th:text="#{explore.lede}">Search every record you may see</span>
    <div class="actions">
      <select id="sortSelect" class="sort-select" th:attr="aria-label=#{explore.sort}">
        <option value="-date"    th:selected="${filter.sort == '-date'}" th:text="#{explore.sort.newest}">Newest first</option>
        <option value="date"     th:selected="${filter.sort == 'date'}" th:text="#{explore.sort.oldest}">Oldest first</option>
        <option value="-outcome" th:selected="${filter.sort == '-outcome'}" th:text="#{explore.sort.outcome}">Outcome desc</option>
      </select>
      <button class="btn" id="refreshBtn" type="button" title="R" th:text="#{explore.refresh}">Refresh</button>
      <button class="btn" id="exportBtn" type="button" th:title="#{explore.export.help}" th:text="#{explore.export}">Export CSV</button>
      <button class="btn" id="verifyBtn" type="button" th:if="${canVerify}" th:title="#{explore.verify.help}" th:text="#{explore.verify}">Verify chain</button>
      <span id="verifyStatus" th:if="${canVerify}" role="status"></span>
    </div>
  </div>

  <div class="searchbar" role="search">
    <label class="label" for="searchInput" th:text="#{explore.search}">Patient</label>
    <input type="text" id="searchInput" class="search-input" th:placeholder="#{explore.search.placeholder}" th:value="${filter.q}" autocomplete="off">
    <button class="search-clear" id="searchClearBtn" type="button" th:title="#{explore.search.clear}">&#10005;</button>
  </div>

  <div id="slaAlertBarWrap" hx-get="/audit/sla-bar" hx-trigger="load, every 30s" hx-target="#slaAlertBarWrap" hx-swap="innerHTML"></div>

  <div class="split">
    <aside class="panel side filters" aria-label="Filters" th:attr="aria-label=#{explore.filters}">
    <!-- Purpose filter -->
    <div class="sidebar-section">
      <div class="sidebar-label">Purpose of Event</div>
      <div class="filter-group" id="purposeFilter">
        <label class="filter-radio"><input type="radio" name="purpose" value="" checked><span>All</span></label>
        <label class="filter-radio"><input type="radio" name="purpose" value="TREAT">  <span>TREAT</span>   <span id="cnt-purpose-TREAT"   class="filter-cnt"></span></label>
        <label class="filter-radio"><input type="radio" name="purpose" value="ETREAT"> <span>ETREAT</span>  <span id="cnt-purpose-ETREAT"  class="filter-cnt"></span></label>
        <label class="filter-radio"><input type="radio" name="purpose" value="BTG">    <span>BTG</span>     <span id="cnt-purpose-BTG"     class="filter-cnt"></span></label>
        <label class="filter-radio"><input type="radio" name="purpose" value="PUBHLTH"><span>PUBHLTH</span> <span id="cnt-purpose-PUBHLTH" class="filter-cnt"></span></label>
        <label class="filter-radio"><input type="radio" name="purpose" value="HRESCH"> <span>HRESCH</span>  <span id="cnt-purpose-HRESCH"  class="filter-cnt"></span></label>
      </div>
    </div>

    <!-- Outcome filter -->
    <div class="sidebar-section">
      <div class="sidebar-label">Outcome</div>
      <div class="filter-group" id="outcomeFilter">
        <label class="filter-radio"><input type="radio" name="outcome" value="" checked><span>All</span></label>
        <label class="filter-radio"><input type="radio" name="outcome" value="0"> <span>Success</span> <span id="cnt-outcome-0"  class="filter-cnt"></span></label>
        <label class="filter-radio"><input type="radio" name="outcome" value="4"> <span>Minor</span>   <span id="cnt-outcome-4"  class="filter-cnt"></span></label>
        <label class="filter-radio"><input type="radio" name="outcome" value="8"> <span>Serious</span> <span id="cnt-outcome-8"  class="filter-cnt"></span></label>
        <label class="filter-radio"><input type="radio" name="outcome" value="12"><span>Major</span>   <span id="cnt-outcome-12" class="filter-cnt"></span></label>
      </div>
    </div>

    <!-- Find by (each box is sent to Chester as a search) -->
    <div class="sidebar-section">
      <div class="sidebar-label">Find by</div>
      <div class="stack-sm">
        <input type="text" id="agentInput"    class="date-input" placeholder="Practitioner (e.g. P001)" autocomplete="off" title="Exact practitioner id or Practitioner/id">
        <input type="text" id="facilityInput" class="date-input" placeholder="Facility (e.g. EXAMPLE001)" autocomplete="off" title="Exact facility id or Organization/id">
        <input type="text" id="encounterInput" class="date-input" placeholder="Encounter (e.g. E-30011)" autocomplete="off" title="Exact encounter id or Encounter/id">
        <input type="text" id="departmentInput" class="date-input" placeholder="Department (e.g. Emergency)" autocomplete="off" title="Exact department text, as the sending system wrote it (case matters)">
        <input type="text" id="clientInput"   class="date-input" placeholder="Submitted by (client id)" autocomplete="off" title="Keycloak client that sent the event">
        <select id="actionSelect" class="sort-select" title="Action">
          <option value="">Any action</option>
          <option value="C">Create (C)</option><option value="R">Read (R)</option><option value="U">Update (U)</option>
          <option value="D">Delete (D)</option><option value="E">Execute (E)</option>
        </select>
        <label class="filter-radio"><input type="checkbox" id="breakGlassBox"><span>Break-glass label only</span></label>
        <label class="filter-radio"><input type="checkbox" id="incompleteBox"><span>Stored as incomplete only</span></label>
      </div>
    </div>

    <!-- Date range -->
    <div class="sidebar-section">
      <div class="sidebar-label">Date Range</div>
      <div class="stack-sm">
        <div>
          <div class="date-label">From</div>
          <input type="date" id="dateFrom" class="date-input">
        </div>
        <div>
          <div class="date-label">To</div>
          <input type="date" id="dateTo" class="date-input">
        </div>
        <button class="btn btn-sm" id="clearDates" type="button">Clear dates</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label" th:text="#{explore.status}">Chester status</div>
      <div id="chesterStatusWrap" hx-get="/audit/status" hx-trigger="load, every 60s" hx-target="#chesterStatusWrap" hx-swap="innerHTML">
        <span th:class="${chesterUp} ? 'chester-pill chester-up' : 'chester-pill chester-down'"
              th:text="${chesterUp} ? #{explore.status.up} : #{explore.status.down}">Connected</span>
      </div>
    </div>
  </aside>

  <section class="grow stack">
    <div class="tab-bar" role="tablist">
      <button class="tab-item active" id="tab-all"     data-tab="all"     th:text="#{explore.tab.all}">All events</button>
      <button class="tab-item"        id="tab-etreat"  data-tab="etreat"  th:text="#{explore.tab.etreat}">ETREAT / BTG</button>
      <button class="tab-item"        id="tab-pending" data-tab="pending" th:text="#{explore.tab.pending}">Pending review</button>
      <button class="tab-item"        id="tab-flagged" data-tab="flagged" th:text="#{explore.tab.flagged}">Flagged</button>
    </div>
    <div class="toolbar">
      <label for="pageSizeSelect" th:text="#{explore.perpage}">Rows per page:</label>
      <select id="pageSizeSelect" class="sort-select">
        <option value="10"  th:selected="${size == 10}">10</option>
        <option value="20"  th:selected="${size == 20}">20</option>
        <option value="50"  th:selected="${size == 50}">50</option>
        <option value="100" th:selected="${size == 100}">100</option>
      </select>
    </div>
    <div id="filterChips" class="chips"></div>
    <div id="auditSection" class="stack">
      <th:block th:insert="~{fragments/audit-rows :: auditSection}"></th:block>
    </div>
  </section>
  </div>
</main>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer-panel"   id="drawerPanel"></div>
<div id="toastContainer"></div>

  <script th:inline="none">
  'use strict';

  /* ── Centralised state ──────────────────────────────────────────────── */
  var state = {
    tab:      'all',
    q:        '',
    purpose:  '',
    outcome:  '',
    dateFrom: '',
    dateTo:   '',
    agent:    '',
    facility: '',
    encounter: '',
    department: '',
    client:   '',
    action:   '',
    breakGlass: false,
    incomplete: false,
    sort:     '-date',
    page:     1,
    size:     20
  };

  /* Seed from server-rendered initial values */
  (function() {
    var si = document.getElementById('searchInput');
    if (si && si.value) state.q = si.value;
    var ss = document.getElementById('sortSelect');
    if (ss && ss.value) state.sort = ss.value;
    var ps = document.getElementById('pageSizeSelect');
    if (ps && ps.value) state.size = parseInt(ps.value, 10) || 20;
    var df = document.getElementById('dateFrom');
    if (df && df.value) state.dateFrom = df.value;
    var dt = document.getElementById('dateTo');
    if (dt && dt.value) state.dateTo = dt.value;
  })();

  /* The filter values both requests (rows, counts) send to the server. Booleans are sent only when on. */
  function filterValues(extra) {
    var v = {
      tab: state.tab, q: state.q, purpose: state.purpose, outcome: state.outcome,
      dateFrom: state.dateFrom, dateTo: state.dateTo, sort: state.sort,
      agent: state.agent, facility: state.facility, encounter: state.encounter, department: state.department, client: state.client, action: state.action
    };
    if (state.breakGlass) v.breakGlass = 'true';
    if (state.incomplete) v.incomplete = 'true';
    return Object.assign(v, extra || {});
  }

  /* ── Core: send all state to /audit/rows ────────────────────────────── */
  function applyFilters(overrides) {
    if (overrides) Object.assign(state, overrides);
    /* Reset to page 1 on any filter/tab change unless caller set page explicitly */
    if (overrides && !Object.prototype.hasOwnProperty.call(overrides, 'page')) {
      state.page = 1;
    }

    /* Sync active tab highlight */
    document.querySelectorAll('.tab-item[data-tab]').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });

    /* Fire HTMX — targets #auditSection, replaces its children (innerHTML).
       #auditSection is a plain <div> so the browser never strips elements
       from the response before HTMX can process it. */
    htmx.ajax('GET', '/audit/rows', {
      target: '#auditSection',
      swap:   'innerHTML',
      values: filterValues({
        page:     String(state.page),
        size:     String(state.size)
      })
    });

    /* Also refresh sidebar count badges */
    refreshCounts();
    renderChips();
    syncUrl();
  }

  /* ── Active-filter chips and a shareable URL ─────────────────────────── */
  var CHIP_LABELS = { q: 'Patient', purpose: 'Purpose', outcome: 'Outcome', dateFrom: 'From', dateTo: 'To',
                      agent: 'Practitioner', facility: 'Facility', encounter: 'Encounter', department: 'Department', client: 'Submitted by', action: 'Action' };
  function activeFilters() {
    var out = [];
    Object.keys(CHIP_LABELS).forEach(function(k) { if (state[k]) out.push([k, CHIP_LABELS[k] + ': ' + state[k]]); });
    if (state.breakGlass) out.push(['breakGlass', 'Break-glass label']);
    if (state.incomplete) out.push(['incomplete', 'Incomplete']);
    return out;
  }
  function clearFilter(k) {
    var o = {};
    o[k] = (k === 'breakGlass' || k === 'incomplete') ? false : '';
    var ids = { q: 'searchInput', dateFrom: 'dateFrom', dateTo: 'dateTo', agent: 'agentInput', facility: 'facilityInput', encounter: 'encounterInput', department: 'departmentInput',
                client: 'clientInput', action: 'actionSelect', breakGlass: 'breakGlassBox', incomplete: 'incompleteBox' };
    var el = ids[k] && document.getElementById(ids[k]);
    if (el) { if (el.type === 'checkbox') el.checked = false; else el.value = ''; }
    if (k === 'purpose' || k === 'outcome') {
      var r = document.querySelector('#' + k + 'Filter input[value=""]'); if (r) r.checked = true;
    }
    applyFilters(o);
  }
  function renderChips() {
    var box = document.getElementById('filterChips');
    if (!box) return;
    box.textContent = '';
    var act = activeFilters();
    act.forEach(function(a) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-sm';
      b.textContent = a[1] + '  \u00d7';
      b.title = 'Remove this filter';
      b.addEventListener('click', function() { clearFilter(a[0]); });
      box.appendChild(b);
    });
    if (act.length > 1) {
      var all = document.createElement('button');
      all.type = 'button'; all.className = 'btn btn-sm'; all.textContent = 'Clear all';
      all.addEventListener('click', function() { act.forEach(function(a) { clearFilter(a[0]); }); });
      box.appendChild(all);
    }
  }
  var URL_KEYS = ['tab', 'q', 'purpose', 'outcome', 'dateFrom', 'dateTo', 'agent', 'facility', 'encounter', 'department', 'client', 'action', 'sort'];
  function syncUrl() {
    var p = new URLSearchParams();
    URL_KEYS.forEach(function(k) { if (state[k] && !(k === 'tab' && state[k] === 'all') && !(k === 'sort' && state[k] === '-date')) p.set(k, state[k]); });
    if (state.breakGlass) p.set('breakGlass', 'true');
    if (state.incomplete) p.set('incomplete', 'true');
    try { history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p.toString() : '')); } catch (e) { }
  }
  /* Restore filters from the URL on load (links can be shared; the server still applies the reader's own access). */
  function restoreFromUrl() {
    var p = new URLSearchParams(location.search), any = false, o = {};
    URL_KEYS.forEach(function(k) { if (p.has(k)) { o[k] = p.get(k).slice(0, 200); any = true; } });
    if (p.get('breakGlass') === 'true') { o.breakGlass = true; any = true; }
    if (p.get('incomplete') === 'true') { o.incomplete = true; any = true; }
    if (!any) return;
    var ids = { q: 'searchInput', dateFrom: 'dateFrom', dateTo: 'dateTo', agent: 'agentInput', facility: 'facilityInput', encounter: 'encounterInput', department: 'departmentInput',
                client: 'clientInput', action: 'actionSelect' };
    Object.keys(ids).forEach(function(k) { if (o[k] != null) { var el = document.getElementById(ids[k]); if (el) el.value = o[k]; } });
    if (o.breakGlass) document.getElementById('breakGlassBox').checked = true;
    if (o.incomplete) document.getElementById('incompleteBox').checked = true;
    ['purpose', 'outcome'].forEach(function(k) {
      if (o[k] != null) { var r = document.querySelector('#' + k + 'Filter input[value="' + o[k].replace(/"/g, '') + '"]'); if (r) r.checked = true; }
    });
    applyFilters(o);
  }

  /* ── Sidebar count badges ───────────────────────────────────────────── */
  function refreshCounts() {
    var params = new URLSearchParams(filterValues());
    fetch('/audit/counts?' + params)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var ocMap = data.outcome || {};
        var pcMap = data.purpose || {};
        function set(id, val) {
          var el = document.getElementById(id);
          /* show badge only when count > 0; empty string triggers CSS :empty → display:none */
          if (el) el.textContent = (val != null && val > 0) ? val : '';
        }
        set('cnt-outcome-0',   ocMap['0']);
        set('cnt-outcome-4',   ocMap['4']);
        set('cnt-outcome-8',   ocMap['8']);
        set('cnt-outcome-12',  ocMap['12']);
        set('cnt-purpose-TREAT',   pcMap['TREAT']);
        set('cnt-purpose-ETREAT',  pcMap['ETREAT']);
        set('cnt-purpose-BTG',     pcMap['BTG']);
        set('cnt-purpose-PUBHLTH', pcMap['PUBHLTH']);
        set('cnt-purpose-HRESCH',  pcMap['HRESCH']);
      })
      .catch(function() {}); /* silent fail */
  }

  /* Load counts on first paint */
  refreshCounts();

  /* ── Tabs ───────────────────────────────────────────────────────────── */
  document.querySelectorAll('.tab-item[data-tab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      applyFilters({ tab: this.dataset.tab, page: 1 });
    });
  });

  /* ── Sidebar: purpose of event radios ───────────────────────────────── */
  document.querySelectorAll('#purposeFilter input[type=radio]').forEach(function(r) {
    r.addEventListener('change', function() { applyFilters({ purpose: this.value }); });
  });

  /* ── Sidebar: outcome radios ────────────────────────────────────────── */
  document.querySelectorAll('#outcomeFilter input[type=radio]').forEach(function(r) {
    r.addEventListener('change', function() { applyFilters({ outcome: this.value }); });
  });

  /* ── Sidebar: date range ────────────────────────────────────────────── */
  document.getElementById('dateFrom').addEventListener('change', function() {
    applyFilters({ dateFrom: this.value });
  });
  document.getElementById('dateTo').addEventListener('change', function() {
    applyFilters({ dateTo: this.value });
  });
  document.getElementById('clearDates').addEventListener('click', function() {
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value   = '';
    applyFilters({ dateFrom: '', dateTo: '' });
  });

  /* ── Topbar: patient search (300ms debounce) ────────────────────────── */
  var searchTimer = null;
  var searchInput   = document.getElementById('searchInput');
  var searchClearBtn = document.getElementById('searchClearBtn');

  function updateSearchClear() {
    if (searchInput.value.trim()) {
      searchClearBtn.classList.add('visible');
    } else {
      searchClearBtn.classList.remove('visible');
    }
  }
  updateSearchClear(); /* init on page load if filter.q pre-filled */

  searchInput.addEventListener('input', function() {
    var val = this.value;
    updateSearchClear();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() { applyFilters({ q: val }); }, 300);
  });
  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { clearTimeout(searchTimer); applyFilters({ q: this.value }); }
  });
  searchClearBtn.addEventListener('click', function() {
    searchInput.value = '';
    updateSearchClear();
    clearTimeout(searchTimer);
    applyFilters({ q: '' });
    searchInput.focus();
  });

  /* ── Sidebar: Find by (practitioner / facility / client text boxes, action, flags) ── */
  function debounced(id, key) {
    var t = null, el = document.getElementById(id);
    el.addEventListener('input', function() {
      var val = this.value; clearTimeout(t);
      t = setTimeout(function() { var o = {}; o[key] = val; applyFilters(o); }, 400);
    });
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { clearTimeout(t); var o = {}; o[key] = this.value; applyFilters(o); }
    });
  }
  debounced('agentInput', 'agent'); debounced('facilityInput', 'facility'); debounced('encounterInput', 'encounter'); debounced('departmentInput', 'department'); debounced('clientInput', 'client');
  document.getElementById('actionSelect').addEventListener('change', function() { applyFilters({ action: this.value }); });
  document.getElementById('breakGlassBox').addEventListener('change', function() { applyFilters({ breakGlass: this.checked }); });
  document.getElementById('incompleteBox').addEventListener('change', function() { applyFilters({ incomplete: this.checked }); });

  /* ── Topbar: verify chain (unrestricted readers only; Chester also enforces it) ── */
  var verifyBtn = document.getElementById('verifyBtn');
  if (verifyBtn) verifyBtn.addEventListener('click', function() {
    var day = (state.dateFrom && state.dateFrom === state.dateTo) ? state.dateFrom : '';
    verifyBtn.disabled = true;
    fetch('/audit/verify-chain' + (day ? '?partition=' + encodeURIComponent(day) : ''))
      .then(function(r) { return r.json(); })
      .then(function(j) {
        if (j.error) { showToast(j.error, 'err'); return; }
        if (Number(j.eventsChecked || 0) === 0) { showToast('Nothing to verify: no events in ' + j.partition + '.', 'ok'); return; }
        var ok = j.valid === true && Number(j.problemCount || 0) === 0 && Number(j.unchainedEvents || 0) === 0;
        var vs = document.getElementById('verifyStatus');
        if (vs) {
          vs.style.color = ok ? 'var(--green, #2e7d32)' : 'var(--red, #c62828)';
          vs.textContent = (ok ? 'Chain valid' : 'CHAIN PROBLEM') + ' · ' + j.partition + ' · ' + new Date().toLocaleTimeString();
          vs.title = (j.details && j.details.length) ? j.details.slice(0, 5).join('\n') : 'No problems found';
        }
        showToast((ok ? 'Chain valid' : 'CHAIN PROBLEM') + ' (' + j.partition + '): ' + (j.eventsChecked || 0) + ' events checked, ' +
                  (j.problemCount || 0) + ' problems, ' + (j.unchainedEvents || 0) + ' unchained', ok ? 'ok' : 'err');
      })
      .catch(function() { showToast('Could not verify the chain.', 'err'); })
      .finally(function() { verifyBtn.disabled = false; });
  });

  /* ── Topbar: export the current filter as CSV (Chester still decides what the user may see) ── */
  var exportBtn = document.getElementById('exportBtn');
  if (exportBtn) exportBtn.addEventListener('click', function() {
    var v = filterValues(); delete v.page; delete v.size;
    window.location = '/audit/export.csv?' + new URLSearchParams(v).toString();
  });

  /* ── Topbar: sort dropdown ──────────────────────────────────────────── */
  document.getElementById('sortSelect').addEventListener('change', function() {
    applyFilters({ sort: this.value });
  });

  /* ── Column header sort clicks — delegated because thead is inside #auditSection ── */
  document.addEventListener('click', function(e) {
    var th = e.target.closest('thead th.sortable[data-sort]');
    if (!th) return;
    var s = th.dataset.sort;
    /* Toggle direction if clicking same column */
    if (state.sort === s) s = s.startsWith('-') ? s.substring(1) : '-' + s;
    document.getElementById('sortSelect').value = s;
    applyFilters({ sort: s });
  });

  /* ── Toolbar: page size (outside #auditSection — survives every swap) ── */
  document.getElementById('pageSizeSelect').addEventListener('change', function() {
    applyFilters({ size: parseInt(this.value, 10) || 20, page: 1 });
  });

  /* ── Topbar: refresh button ─────────────────────────────────────────── */
  document.getElementById('refreshBtn').addEventListener('click', function() {
    applyFilters();
  });

  /* ── Pagination: delegated click (#paginationWrap is inside #auditSection) ── */
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.page-btn');
    if (!btn || btn.classList.contains('disabled') || !btn.dataset.page) return;
    applyFilters({ page: parseInt(btn.dataset.page, 10) });
  });

  /* ── Table row action buttons — delegated (tbody is inside #auditSection) ── */
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('#auditTbody .row-btn');
    if (!btn) return;
    var row = btn.closest('tr[data-id]');
    if (!row) return;
    var id = row.dataset.id;
    if (btn.classList.contains('view-btn'))   openDrawer(id);
    if (btn.classList.contains('review-btn')) markReview(id, 'reviewed');
    /* flag-btn: if row is currently flagged → remove flag (set pending), else flag it */
    if (btn.classList.contains('flag-btn')) {
      var currentStatus = row.dataset.reviewStatus || 'pending';
      markReview(id, currentStatus === 'flagged' ? 'pending' : 'flagged');
    }
  });

  /* ── Drawer ─────────────────────────────────────────────────────────── */
  function openDrawer(id) {
    document.getElementById('drawerOverlay').classList.add('open');
    document.getElementById('drawerPanel').classList.add('open');
    htmx.ajax('GET', '/audit/detail/' + id, {
      target: '#drawerPanel',
      swap:   'innerHTML'
    });
  }

  function closeDrawer() {
    document.getElementById('drawerOverlay').classList.remove('open');
    document.getElementById('drawerPanel').classList.remove('open');
  }

  window.openDrawer  = openDrawer;
  window.closeDrawer = closeDrawer;

  /* every htmx request carries the CSRF token (Spring Security rejects POSTs without it) */
  document.addEventListener('htmx:configRequest', function (e) {
    var t = document.querySelector('meta[name="_csrf"]'), h = document.querySelector('meta[name="_csrf_header"]');
    if (t && h) e.detail.headers[h.content] = t.content;
  });

  /* ── Mark review (from row action buttons) ──────────────────────────── */
  function markReview(id, status) {
    htmx.ajax('POST', '/audit/review/' + id, {
      target: '#row-' + id,
      swap:   'none',
      values: { status: status }
    });
  }

  /* ── Toast ──────────────────────────────────────────────────────────── */
  function showToast(msg, type) {
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast ' + (type || 'ok');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function() {
      t.style.opacity = '0';
      setTimeout(function() { t.remove(); }, 400);
    }, 3000);
  }
  window.showToast = showToast;

  /* ── HTMX event: auditReviewed ──────────────────────────────────────── */
  document.body.addEventListener('auditReviewed', function(evt) {
    var id     = (evt.detail && evt.detail.id)     ? evt.detail.id     : '';
    var status = (evt.detail && evt.detail.status) ? evt.detail.status : 'updated';
    showToast('AuditEvent/' + id + ' marked as ' + status, 'ok');
    applyFilters();  /* refresh so review badges update */
  });

  /* ── Keyboard shortcuts ─────────────────────────────────────────────── */
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'r' || e.key === 'R') { applyFilters(); return; }
    if (e.key === 'Escape') { closeDrawer(); return; }
    if (e.key === '/') { e.preventDefault(); document.getElementById('searchInput').focus(); }
  });

  /* htmx loads deferred, so start after the page is ready */
  document.addEventListener('DOMContentLoaded', function() { restoreFromUrl(); renderChips(); });
  </script>

</body>
</html>
