<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{access.out.title} + ' · ' + #{app.name}">Signed out</title>
  <link rel="stylesheet" th:href="@{/css/audit-console.css}">
  <link rel="stylesheet" th:href="@{/css/page-access.css}">
  <script th:src="@{/js/access-session.js}" defer></script>
</head>
<body>
<main id="main" class="page">
  <section class="panel acc-signed" aria-labelledby="so-h">
    <div class="panel-head"><h3 th:text="#{access.out.head}">Signed out</h3></div>
    <div class="state">
      <div class="state-icon bad" aria-hidden="true">!</div>
      <h1 id="so-h" th:text="#{access.out.title}">Your sign-in has expired</h1>
      <p th:if="${fromPage == null}" th:text="#{access.out.text}">Sign in again to carry on.</p>
      <p th:if="${fromPage != null}" th:text="${fromCase != null} ? #{access.out.back.case(#{'nav.' + ${fromPage}}, ${fromCase})} : #{access.out.back(#{'nav.' + ${fromPage}})}">Sign in again to go back.</p>
      <p class="sub" th:text="#{access.out.draft}">Unsaved text in the decision box was kept on this device and will return.</p>
      <a class="btn btn-primary" th:href="@{/login}" th:text="#{access.out.signin}">Sign in</a>
    </div>
  </section>
</main>
</body>
</html>
