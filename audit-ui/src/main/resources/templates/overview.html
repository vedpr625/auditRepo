<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"
      th:attr="data-theme=${prefs.themeAttr()},data-density=${prefs.densityAttr()}">
<head th:replace="~{fragments/layout :: headx(#{overview.title}, 'page-overview.css')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header('overview')}"></th:block>
<main id="main" class="page ov">
  <div class="page-head"><h1 th:text="#{overview.title}">Overview</h1><span class="lede" th:text="#{overview.lede}">What needs a decision, and what is arriving</span></div>

  <div id="ov-body" th:if="${allowed}"
       th:attr="hx-get=@{/overview/body(range=${p.range},from=${p.from},to=${p.to},facility=${p.facility},compare=${p.compare ? '1' : null})}"
       hx-trigger="load, every 60s" hx-swap="innerHTML" aria-live="polite">
    <div class="ov-kpis" aria-hidden="true">
      <div class="panel kpi" th:each="i : ${#numbers.sequence(1, 6)}"><div class="skeleton ov-sk1"></div><div class="skeleton ov-sk2"></div><div class="skeleton ov-sk3"></div></div>
    </div>
    <div class="panel mt-3"><th:block th:replace="~{fragments/states :: loading(6)}"></th:block></div>
  </div>
  <div class="panel" th:unless="${allowed}"><th:block th:replace="~{fragments/states :: notAllowed(#{overview.denied.title}, #{overview.denied.text}, #{nav.settings}, '/settings')}"></th:block></div>

  <noscript><div class="notice notice-warn" th:text="#{overview.noscript}">Overview needs JavaScript to load its figures.</div></noscript>
</main>
<script th:src="@{/js/page-overview.js}" defer></script>
</body>
</html>
