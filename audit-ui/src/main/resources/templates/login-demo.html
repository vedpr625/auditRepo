<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: headbare(#{login.title})}"></head>
<body class="auth-body">
<div class="demo-strip" role="note" th:if="${demoBanner}"><b th:text="#{demo.banner}">Sample data</b></div>
<main id="main" class="auth">
  <div class="auth-brand"><span class="brand-mark" aria-hidden="true"></span><span th:text="#{app.name}">Audit Repository</span></div>
  <h1 th:text="#{login.title}">Sign in</h1>
  <p class="auth-tag" th:text="#{login.tagline}">Audit event review</p>
  <div class="notice notice-bad" role="alert" th:if="${param.error != null}" th:text="#{login.error}">Wrong name or password.</div>
  <div class="notice notice-info" role="status" th:if="${param.logout != null}" th:text="#{login.loggedout}">Signed out.</div>

  <section class="panel" aria-labelledby="l-pick">
    <div class="panel-head"><h2 id="l-pick" class="h-small" th:text="#{login.pick}">Sample users for evaluation</h2></div>
    <div class="auth-pick">
      <form th:each="u : ${demoUsers}" th:action="@{/login}" method="post">
        <input type="hidden" name="username" th:value="${u.username}">
        <input type="hidden" name="password" th:value="${u.password}">
        <button class="pick" type="submit">
          <b th:text="${u.title}">Role</b>
          <span class="mono sub" th:text="${u.username} + ' / ' + ${u.password}">name / password</span>
          <span class="sub" th:text="${u.can}">what they can do</span>
        </button>
      </form>
    </div>
  </section>

  <section class="panel" aria-labelledby="l-form">
    <div class="panel-head"><h2 id="l-form" class="h-small" th:text="#{login.manual}">Sign in with a name and password</h2></div>
    <form class="panel-pad stack" th:action="@{/login}" method="post">
      <label class="field"><span th:text="#{login.username}">Name</span><input class="input" name="username" autocomplete="username" required></label>
      <label class="field"><span th:text="#{login.password}">Password</span><input class="input" type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit" th:text="#{login.submit}">Sign in</button>
    </form>
  </section>
</main>
</body>
</html>
