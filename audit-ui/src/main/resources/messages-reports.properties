# Messages for the reports screen (English). Use the typographic apostrophe, and keys prefixed "reports.".
reports.title=Reports
reports.lede=Ready-made reports for audits and the privacy officer. Download them as CSV, JSON or PDF.
reports.choose=Choose a report
reports.r.patient.title=Who accessed a patient
reports.r.patient.sub=For a patient asking who saw their record
reports.r.patient.desc=Lists everyone who opened or changed this patient’s record, with the reason and the system used.
reports.r.person.title=What a person accessed
reports.r.person.sub=All records opened by one practitioner
reports.r.person.desc=Every record one person or system opened or changed, with the purpose and the system used.
reports.r.facility.title=Facility activity
reports.r.facility.sub=Volume, failures and break-glass by facility
reports.r.facility.desc=Records, refused requests, break-glass and incomplete records for each facility. Counts are asked of the repository, nothing is sampled.
reports.r.breakglass.title=Break-glass
reports.r.breakglass.sub=Every emergency access with reason and review
reports.r.breakglass.desc=Every emergency access in the period, with the reason given afterwards and whether it was reviewed.
reports.r.failed.title=Failed access
reports.r.failed.sub=Refused and invalid requests by system
reports.r.failed.desc=Requests that were refused or invalid, with the system that sent them and why they failed.
reports.r.reviews.title=Review decisions
reports.r.reviews.sub=Decisions and time taken
reports.r.reviews.desc=Every review decision taken in the period, and the hours from the access to the decision. Only records you may see are listed.
reports.r.health.title=System health
reports.r.health.sub=Which systems sent what, and gaps
reports.r.health.desc=Records and failures per sending system, when each last sent, and whether it looks active. Gap detection is planned (needs a sequence number from each system).
