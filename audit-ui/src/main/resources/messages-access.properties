# Access and trust screens: roles board, console activity log, restricted records, session timer, signed-out page. English only.
access.title=Access and trust
access.h1=Who can do what, and how the console earns trust
access.lede=These screens answer what a third-party auditor will ask first: who watches the watchers, who sees which patients, and whether a decision can be changed afterwards. Roles and users are managed in Keycloak; this page shows what the console enforces for each role.
