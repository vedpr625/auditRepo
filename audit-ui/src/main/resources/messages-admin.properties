admin.users.head=Users
admin.users.planned=Planned · next release
admin.users.text2=Invite a person, set their role, disable them and send a password reset, without opening Keycloak. Done through Keycloak’s Admin API using a service account limited to this realm. Every change would be recorded in the change history. Realm settings, clients and sign-in policy stay in Keycloak.
admin.users.warn=The service account can create users, so its secret would be stored with the same care as a database password.
admin.users.demo=Demo accounts (made up, demo build only)
admin.users.demo.note=These five accounts exist only in the demonstration build. A real site lists its people in Keycloak.
admin.users.invite=Invite a person
admin.users.disable=Disable
admin.users.reset=Send password reset
admin.roles.head=Roles (managed in Keycloak)
admin.roles.note=From the design. Set in Keycloak: this console does not check or enforce the sender and reader split.
admin.role.AUDIT_WRITER=sends records. Cannot read them.
admin.role.MINISTRY_AUDITOR=reads everything and reviews.
admin.role.PRIVACY_OFFICER=reads everything, settles disagreements.
admin.role.FACILITY_AUDITOR=reads only its own facility.
admin.role.AUDIT_ADMIN=manages the console.
admin.rules.head=Rules and thresholds
admin.rules.text=Read only. These values come from the application configuration or are built in; change them in the configuration file and restart.
