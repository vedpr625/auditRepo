# Put in /etc/nginx/sites-available/audit-ui-demo and link into sites-enabled. Replace DEMO_HOST. Run certbot afterwards:
#   sudo certbot --nginx -d DEMO_HOST
# Optional password in front of everything (recommended if the site should not be open to the public):
#   sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.demo-htpasswd reviewer
server {
    listen 80;
    server_name DEMO_HOST;

    # auth_basic "Demo";
    # auth_basic_user_file /etc/nginx/.demo-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:APP_PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # REQUIRED: keeps the stand-in registry and audit repository private
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
